# Production nginx: serves the built assets and passes everything else to PHP-FPM ("app").
# HTTPS is handled in front of this by Caddy (which also sends WebSocket traffic straight to Reverb).
server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 2M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite's build files have content hashes in their names, so they can be cached forever.
    location /build/assets/ {
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Look "app" up through Docker's DNS on each request (cached 10s) rather than once at startup.
    # Otherwise recreating only the app container (e.g. after an .env change) gives it a new IP that
    # nginx never sees, and every request 502s until web is restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    location = /index.php {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        # Never pass a client's "Proxy" header on as HTTP_PROXY (the "httpoxy" vulnerability).
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 30s;
    }

    # Only index.php runs; any other .php file is just a 404.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
